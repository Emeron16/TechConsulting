# Airflow's OWN Postgres + webserver + scheduler, LocalExecutor -- a
# separate container/volume/network from the app's own Postgres
# (volvo-postgres, ../docker-compose.yml). Never share these two Postgres
# instances: Airflow's is its own metadata DB (DAG runs, task instances,
# connections), the app's is the warranty_cases/case_classifications/
# safety_escalations/audit_log domain schema. Confirmed during Phase 7
# setup that containers on this Docker Desktop for Mac install can reach
# the host-run FastAPI service via host.docker.internal:8100 (a real,
# verified HTTP 200 from inside a throwaway container, not assumed).
services:
  airflow-postgres:
    image: postgres:16-alpine
    container_name: volvo-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - volvo_airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.4-python3.12
    container_name: volvo-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow --firstname Volvo --lastname Demo --role Admin --email airflow@example.com || true
    volumes:
      - ./dags:/opt/airflow/dags

  airflow-webserver:
    image: apache/airflow:2.10.4-python3.12
    container_name: volvo-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8180}:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - volvo_airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    image: apache/airflow:2.10.4-python3.12
    container_name: volvo-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - volvo_airflow_logs:/opt/airflow/logs
    command: scheduler

volumes:
  volvo_airflow_postgres_data:
  volvo_airflow_logs:
